@if(isLoaded){

<div class="app-page">
  <div class="page-head">
    <div>
      <h1 class="page-title">Consultants</h1>
    </div>
    <div class="toolbar">
      <button class="btn btn-pink" (click)="AddConsultant()" title="Nouveau">Ajouter</button>
    </div>
  </div>
  <div class="table-shell">
    <div class="table-scroll">
    <table class="table table-success table-striped">
      <thead class="table-dark">
        <tr>
          <th scope="col">Prénom</th>
          <th scope="col">Nom</th>
          <th scope="col">Fonction</th>
          <th scope="col">Adresse Email</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (consultant of consultants; track consultant.id) {
        <tr>
          <td style="text-align: center;" data-label="Prénom">{{ consultant.firstName }}</td>
          <td data-label="Nom">{{ consultant.lastName }}</td>
          <td data-label="Fonction">{{ consultant.fonction }}</td>
          <td data-label="Adresse Email">{{ consultant.email }}</td>

          <td class="cell-actions" data-label="Actions">
            <button class="btn btn-outline-primary btn-sm me-2" (click)="editConsultant($event, consultant)"
              title="Modifier Consultant" [disabled]="!isAdmin">
              <i class="bi bi-pencil"></i>

            </button>

            <button class="btn btn-outline-danger btn-sm me-2" (click)="deleteConsultant($event, consultant)"
              title="Supprimer Consultant" [disabled]="!isAdmin || consultant.hasPrestation">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
        }
      </tbody>
    </table>
    </div>
  </div>
</div>
}@else {
<bill-waiting></bill-waiting>
}
