@if(isLoaded){
<div class="mt-4 mx-5">
  <div class="d-flex justify-content-between align-items-end">
    <div class="mb-3 me-2" style="width: 200px">
      <label for="companySelect" class="form-label fw-bold">Société</label>
    </div>
    <div class="mb-3">
      <button class="btn btn-pink" title="Nouveau" (click)="addCampany()">
        Ajouter
      </button>
    </div>
  </div>
  <div class="table-responsive">
    <table class="table table-success table-striped">
      <thead class="table-dark">
        <tr>
          <th scope="col">Raison sociale</th>
          <th scope="col">Siret</th>
          <th scope="col">RCS</th>
          <th scope="col">Nom TVA</th>
          <th scope="col">Code APE</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (company of filtredCompanies; track company.id) {
        <tr [ngClass]="{
            'table-success': company.checked== true,
            'table-danger': company.checked== false
          }">
          <td style="text-align: center">{{ company.socialReason }}</td>
          <td>{{ company.siret }}</td>
          <td>{{ company.rcsName }}</td>
          <td>{{ company.numeroTva }}</td>
          <td>{{ company.codeApe }}</td>

          <td>
            <label for="companyCheck">
              <input class="form-check-input custom-checkbox me-4" type="checkbox" [checked]="company.checked"
                id="companyCheck" disabled />
            </label>

            <button class="btn btn-outline-primary btn-sm me-2" (click)="editCompany($event,company)"
              title="Modifier Company" [disabled]="!isAdmin || !company.checked">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-outline-danger btn-sm" (click)="deleteCompany($event,company)"
              title="Supprimer Company" [disabled]="!isAdmin || !company.checked">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
} @else {
<bill-waiting [edit]="parent"></bill-waiting>
}
