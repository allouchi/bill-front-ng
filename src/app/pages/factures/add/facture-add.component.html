@if(isUpload){
<div class="app-page">
  <div class="page-head">
    <h1 class="page-title">Ajout d'une nouvelle facture</h1>
  </div>

  <div class="card">
    <div class="card-body">
      <form [formGroup]="formFacture" (ngSubmit)="addFacture()">
        <div class="form-grid cols-2">

          <!-- Combo Box (Select) -->
          <div>
            <label for="monthSelect" class="form-label fw-bold">Mois de la Facture : *</label>
            <select (change)="setMonthValue($event)" class="form-select" id="monthSelect"
              formControlName="monthFacture">
              @for (month of monthsYear; track month.id) {
              <option value="{{ month.id }}">{{ month.label }}</option>
              }
            </select>
            <div *ngIf="
                formFacture.get('monthFacture')?.invalid &&
                formFacture.get('monthFacture')?.touched
              " class="text-danger">
              Ce champ est requis.
            </div>
          </div>

          <!-- Champ de saisie -->
          <div>
            <label for="numeroCommande" class="form-label fw-bold">Numéro de commande : *
            </label>
            <input formControlName="numeroCommande" type="text" class="form-control" id="numeroCommande"
              placeholder="Entrez Numéro de commande" />
            <div *ngIf="
                formFacture.get('numeroCommande')?.invalid &&
                formFacture.get('numeroCommande')?.touched
              " class="text-danger">
              Ce champ est requis.
            </div>
          </div>

          <div>
            <label for="exampleInput" class="form-label fw-bold">Quantité : *</label>
            <input formControlName="quantite" type="text" class="form-control" id="quantite"
              placeholder="Saisir le nombre de jours" [class.is-invalid]="
                                                                                          formFacture.get('quantite')?.invalid &&
                                                                                          formFacture.get('quantite')?.touched
                                                                                        " />
            <div *ngIf="
                                          formFacture.get('quantite')?.errors?.['required'] &&
                                          formFacture.get('quantite')?.touched
                            " class="text-danger">
              Ce champ est requis.
            </div>
            <div
              *ngIf="
                                                                                                                                                      formFacture.get('quantite')?.errors?.['notNumeric'] &&
                                                                                                                                                      formFacture.get('quantite')?.touched
                                                                                                                                            "
              class="text-danger">
              Ce champ doit être numérique.
            </div>
          </div>

          <div>
            <label for="exampleInput" class="form-label fw-bold">Client Prestation : *</label>
            <input formControlName="clientPrestation" type="text" class="form-control" id="clientPrestation"
              placeholder="Entrez Client Prestation" />

            <div *ngIf="
                formFacture.get('clientPrestation')?.invalid &&
                formFacture.get('clientPrestation')?.touched
              " class="text-danger">
              Ce champ est requis.
            </div>
          </div>

          <div>
            <label for="taxTypesSelect" class="form-label fw-bold">Type impôts</label>
            <select formControlName="taxType" class="form-select" id="taxTypesSelect">
              @for (tax of taxTypes; track tax.id) {
              <option value="{{ tax.id }}">
                {{ tax.descr }}
              </option>
              }
            </select>
          </div>
        </div>

        <div class="form-actions sticky-actions d-flex justify-content-center gap-3 mt-4">
          <button class="btn btn-secondary" (click)="cancel()">
            Annuler
          </button>
          <button class="btn btn-primary" type="submit">Valider</button>
        </div>
      </form>
    </div>
  </div>
</div>

} @else {
<bill-waiting [edit]="parent"></bill-waiting>
}
