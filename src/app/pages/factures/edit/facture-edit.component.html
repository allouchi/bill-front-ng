<div class="app-page">
  <div class="page-head">
    <h1 class="page-title">Mise à jour de la facture numéro : {{numeroFacture}}</h1>
    <p class="form-hint">Renseignez les informations ci-dessous. Les champs marqués d'un astérisque (*) sont obligatoires.</p>
  </div>

  <hr class="rule-gold mb-4">

  <div class="card">
    <div class="card-body">
      <form [formGroup]="formFacture" #form="ngForm" (ngSubmit)="encaisserFacture()">
        <div class="form-grid">
          <div>
            <label class="form-label fw-bold" for="dateEncaissement fw-bold"> Date d'Encaissment</label>
            <input type="date" id="dateEncaissement" class="form-control" formControlName="dateEncaissement"
              [class.is-invalid]="
            formFacture.get('dateEncaissement')?.invalid &&
            formFacture.get('dateEncaissement')?.touched
          " />

            <div *ngIf="
            formFacture.get('dateEncaissement')?.invalid &&
            formFacture.get('dateEncaissement')?.touched
          " class="text-danger">
              Ce champ est requis.
            </div>
          </div>
        </div>

        <div class="form-actions sticky-actions d-flex justify-content-center gap-3 mt-4">
          <button class="btn btn-secondary" (click)="cancel()">Annuler</button>
          <button class="btn btn-primary" type="submit">Valider</button>
        </div>
      </form>
    </div>
  </div>
</div>
