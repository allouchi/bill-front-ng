<div class="app-page">
  <div class="page-head">
    <h1 class="page-title">Ajout d'un utilisateur</h1>
  </div>

  <div class="card">
    <div class="card-body">
      <form [formGroup]="userForm" (ngSubmit)="addUser()">
        <div class="form-grid cols-2">

          <div class="col-span-2">
            <label for="email" class="form-label fw-bold">Email</label>
            <input
              type="email"
              id="email"
              class="form-control"
              formControlName="email"
               [class.is-invalid]="
              userForm.get('email')?.invalid &&
              userForm.get('email')?.touched"
            />
            <div *ngIf="userForm.get('email')?.errors?.['required'] && userForm.get('email')?.touched" class="text-danger">
              L'adresse Email est requise.
            </div>
            <div *ngIf="userForm.get('email')?.errors?.['invalidEmail'] && userForm.get('email')?.touched" class="text-danger">
              L'adresse e-mail n'est pas valide.
            </div>
          </div>

          <div>
            <label for="firstName" class="form-label fw-bold">Nom</label>
            <input
              type="text"
              id="firstName"
              class="form-control"
              formControlName="firstName"
            />
            <div
              class="text-danger"
              *ngIf="
                userForm.get('firstName')?.invalid &&
                userForm.get('firstName')?.touched
              "
            >
              Le nom est requis.
            </div>
          </div>

          <div>
            <label for="lastName" class="form-label fw-bold">Prénom</label>
            <input
              type="text"
              id="lastName"
              class="form-control"
              formControlName="lastName"
            />
            <div
              class="text-danger"
              *ngIf="
                userForm.get('lastName')?.invalid &&
                userForm.get('lastName')?.touched
              "
            >
              Le nom est requis.
            </div>
          </div>

          <div>
            <label for="password" class="form-label fw-bold">Mot de passe :
            </label>
            <input type="password" id="password" class="form-control" formControlName="password" />
            <ng-container *ngIf="userForm.get('password') as champ">
              <div *ngIf="champ.errors?.['customError'] && champ.touched" class="text-danger">
                Le mot de passe doit-être identique.
              </div>
            </ng-container>
          </div>

          <div>
            <label for="passwordConfirm" class="form-label fw-bold">Confirmation :</label>
            <input type="password" id="passwordConfirm" class="form-control" formControlName="passwordConfirm" />
            <ng-container *ngIf="userForm.get('passwordConfirm') as champ">
              <div *ngIf="champ.errors?.['customError'] && champ.touched" class="text-danger">
                Le mot de passe doit-être identique.
              </div>
            </ng-container>
          </div>

          <div>
            <label for="rolesSelect" class="form-label fw-bold">Role</label>
            <select
              [(ngModel)]="selectedRole"
              formControlName="role"
              (change)="setRoleValue($event)"
              class="form-select"
              id="rolesSelect"
            >
              @for (role of roles; track role.id) {
              <option value="{{ role.id }}" [value]="role.roleName">
                {{ role.description }}
              </option>
              }
            </select>

            <div
              class="text-danger"
              *ngIf="
                userForm.get('role')?.invalid && userForm.get('role')?.touched
              "
            >
              Le role est requis.
            </div>
          </div>

          <div>
            <label for="companySelect" class="form-label fw-bold">Société</label>
            <select
              [(ngModel)]="selectedCompany"
              formControlName="siret"
              (change)="setCompanyValue($event)"
              class="form-select"
              id="companySelect"
            >
              @for (company of companies; track company.id) {
              <option value="{{ company.siret }}" [value]="company.siret">
                {{ company.socialReason }}
              </option>
              }
            </select>
          </div>
        </div>

        <div class="form-actions sticky-actions d-flex justify-content-center gap-3 mt-4">
          <button class="btn btn-secondary" (click)="cancel()">
            Annuler
          </button>
          <button class="btn btn-primary" type="submit">Valider</button>
        </div>
      </form>
    </div>
  </div>
</div>
