@if(isLoaded){

<div class="app-page">
  <div class="page-head">
    <div>
      <h1 class="page-title">Utilisateurs</h1>
    </div>
    <div class="toolbar">
      <button class="btn btn-pink" (click)="addUser()" title="Nouveau">
        Ajouter
      </button>
    </div>
  </div>
  <div class="table-shell">
    <div class="table-scroll">
  <table class="table table-success table-striped">
    <thead class="table-dark">
      <tr>
        <th scope="col">Identité</th>
        <th scope="col">Email</th>
        <th scope="col">Société</th>
        <th scope="col">Role</th>
        <th scope="col">Actif</th>
        <th scope="col">Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (user of filtredUsers; track user.id) {
      <tr>
        <td style="text-align: center" data-label="Identité">
          {{ user | userPipe }}
        </td>
        <td data-label="Email">{{ user.email }}</td>
        <td data-label="Société">{{ user.siret! | raisonSociale : companies }}</td>
        <td *ngIf="user.roles" data-label="Role">
          <span *ngFor="let role of user.roles; let last = last">
            {{ role.description }}<span *ngIf="!last">, </span>
          </span>
        </td>
        <td data-label="Actif">{{ user.activated ? "oui" : "non" }}</td>

        <td class="cell-actions" data-label="Actions">
          <button
            class="btn btn-outline-primary btn-sm me-2"
            (click)="editUser($event, user)"
            title="Modifier user"
            [disabled]="!isAdmin"
          >
            <i class="bi bi-pencil"></i>
          </button>

          <button
            class="btn btn-outline-danger btn-sm me-2"
            (click)="deleteUser($event, user)"
            title="Supprimer utilisateur"
            [disabled]="!isAdmin"
          >
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
      }
    </tbody>
  </table>
    </div>
  </div>
</div>
}@else {
<bill-waiting [edit]="parent"></bill-waiting>
}
