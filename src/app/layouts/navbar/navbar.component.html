<nav class="topbar">
  <div class="topbar-inner">
    <!-- Brand -->
    <a class="brand" routerLink="/dashboard" (click)="onNavClick('')" aria-label="Facturation">
      <img src="assets/logo.svg" width="34" height="34" alt="" class="brand-mark" />
      <span class="brand-text">
        Facturation
        @if (selectedInfos) { <span class="brand-sub">{{ selectedInfos }}</span> }
      </span>
    </a>

    <!-- Mobile toggler -->
    @if (isAuth) {
    <button class="icon-btn nav-burger" type="button" (click)="toggleMobile()"
      [attr.aria-expanded]="mobileOpen" aria-label="Menu">
      <i class="bi" [class.bi-list]="!mobileOpen" [class.bi-x-lg]="mobileOpen"></i>
    </button>
    }

    <!-- Primary nav -->
    @if (isAuth) {
    <ul class="nav-links" [class.open]="mobileOpen">
      @for (item of navItems; track item.route) {
      <li>
        <a class="nav-link" [routerLink]="item.route" routerLinkActive="active"
          (click)="onNavClick(item.label)">
          <i class="bi {{ item.icon }}"></i>
          <span [translate]="item.key || ''">{{ item.label }}</span>
        </a>
      </li>
      }
    </ul>
    }

    <!-- Right cluster -->
    <div class="topbar-actions">
      <!-- Language switch -->
      <div class="seg-toggle" role="group" aria-label="Langue">
        <button type="button" class="seg" [class.on]="selectedLang === 'fr'" (click)="setLang('fr')">FR</button>
        <button type="button" class="seg" [class.on]="selectedLang === 'en'" (click)="setLang('en')">EN</button>
      </div>

      <!-- Dark-mode toggle -->
      <button class="icon-btn theme-btn" type="button" (click)="toggleTheme()"
        [attr.aria-label]="themeService.theme() === 'dark' ? 'Activer le mode clair' : 'Activer le mode sombre'"
        title="Thème clair / sombre">
        <i class="bi" [class.bi-sun-fill]="themeService.theme() === 'dark'"
          [class.bi-moon-stars-fill]="themeService.theme() !== 'dark'"></i>
      </button>

      <!-- User menu -->
      <div class="dropdown">
        <button class="user-btn" type="button" id="userDropdown" data-bs-toggle="dropdown"
          aria-expanded="false" aria-label="Compte utilisateur">
          <i class="bi bi-person-circle"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
          @if (!isAuth) {
          <li><a class="dropdown-item fw-bold" routerLink="/login"><i class="bi bi-box-arrow-in-right me-2"></i>ME CONNECTER</a></li>
          } @else {
          <li><a class="dropdown-item fw-bold" (click)="switchParametres($event)"><i class="bi bi-sliders me-2"></i>PARAMETRES</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item fw-bold text-danger" (click)="userLogout($event)"><i class="bi bi-box-arrow-right me-2"></i>ME DECONNECTER</a></li>
          }
        </ul>
      </div>
    </div>
  </div>
</nav>

<!-- Mobile backdrop -->
@if (isAuth && mobileOpen) {
<div class="nav-backdrop" (click)="toggleMobile()"></div>
}

<bill-header></bill-header>
