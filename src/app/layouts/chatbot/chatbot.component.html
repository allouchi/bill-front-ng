<button class="chat-toggle" (click)="toggleChat()">
  <i class="bi bi-chat-dots-fill"></i>
</button>

<div class="chat-container" *ngIf="isOpen">

  <div class="chat-header">
    <div class="header-left">
      <div class="avatar"><i class="bi bi-robot"></i></div>
      <span>Assistant</span>
    </div>
    <button class="close-btn" (click)="toggleChat()"><i class="bi bi-x-lg"></i></button>
  </div>

  <div class="messages" #scrollContainer>

    <div *ngFor="let msg of messages" class="message-wrapper" [ngClass]="msg.role">
      <div class="message-bubble" [ngClass]="{'bot-text': msg.role === 'bot'}">
        {{ msg.text }}
      </div>
    </div>

    <div *ngIf="isLoading" class="message-wrapper bot">
      <div class="message-bubble typing">
        <span></span><span></span><span></span>
      </div>
    </div>

  </div>

  <div class="input-container">
    <textarea [(ngModel)]="userInput" (keydown)="onEnter($event)" [disabled]="isLoading"
      placeholder="Écris ton message..." rows="1" class="chat-textarea">
    </textarea>

    <button (click)="sendMessage()" [disabled]="isLoading">
      <i class="bi bi-send-fill"></i>
    </button>
  </div>
</div>
