<!-- Bouton flottant -->
<button class="chat-toggle" (click)="toggleChat()">
  💬
</button>

<!-- Chat -->
<div class="chat-container" *ngIf="isOpen">

  <!-- HEADER -->
  <div class="chat-header">
    <div class="header-left">
      <div class="avatar">🤖</div>
      <span>Assistant</span>
    </div>

    <button class="close-btn" (click)="toggleChat()">✖</button>
  </div>

  <!-- Messages -->
  <div class="messages" #scrollContainer>

    <div *ngFor="let msg of messages" class="message-wrapper" [ngClass]="msg.role">

      <div class="message-bubble">
        {{ msg.text }}
      </div>
    </div>

    <!-- Typing -->
    <div *ngIf="isLoading" class="message-wrapper bot">
      <div class="message-bubble typing">
        <span></span><span></span><span></span>
      </div>
    </div>

  </div>

  <!-- Input -->
  <div class="input-container">
    <input [(ngModel)]="userInput" (keyup.enter)="sendMessage()" [disabled]="isLoading"
      placeholder="Écris ton message..." />

    <button (click)="sendMessage()" [disabled]="isLoading">
      ➤
    </button>
  </div>

</div>
